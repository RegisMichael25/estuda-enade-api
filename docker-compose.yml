services:
  database:
    image: postgres:16-alpine
    container_name: estuda-enade-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=estudaenade
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estudaenade"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    container_name: estuda-enade-api
    depends_on:
      database:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/estudaenade
      - JWT_SECRET=${JWT_SECRET:-}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
