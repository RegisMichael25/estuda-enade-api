# =============================================================
# Configuração única da aplicação: não há perfis (dev, prod...).
# Os valores padrão funcionam com o docker-compose.yml deste repositório;
# para mudar qualquer um deles, defina a variável de ambiente correspondente.
# =============================================================
spring.application.name=estuda-enade-api

# Segredos locais: se existir um arquivo .env na pasta de onde a API é iniciada, ele é lido
# (formato CHAVE=valor; veja .env.example). O .env não vai para o repositório.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# ---------- Banco de dados ----------
# Padrão: serviço "database" do docker-compose.yml, exposto em localhost:5435
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/estudaenade}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Esquema e dados de exemplo (professor, aluno, turma, questões e atividades)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JWT ----------
# Segredo que assina os tokens (mínimo de 32 caracteres). Não tem valor no repositório: defina
# JWT_SECRET no .env ou no ambiente. Sem ele, a API gera um segredo aleatório a cada subida,
# e as sessões abertas precisam ser renovadas depois de reiniciar.
jwt.secret=${JWT_SECRET:}
jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:30}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# ---------- Login com senha ----------
# Senhas erradas seguidas antes de bloquear o login com senha da conta, e por quanto tempo
auth.login.max-falhas=${AUTH_LOGIN_MAX_FALHAS:5}
auth.login.bloqueio-minutos=${AUTH_LOGIN_BLOQUEIO_MINUTOS:15}

# ---------- Login com Google ----------
# Client IDs OAuth do Google aceitos no "aud" do ID token, separados por vírgula
# (o client web do front e, se houver, os dos apps). Vazio = login com Google desligado (503 GOOGLE_DESABILITADO).
google.client-ids=${GOOGLE_CLIENT_IDS:}

# ---------- Código por e-mail para redefinir a senha ("esqueci a senha") ----------
# log = escreve o código no log da aplicação | smtp = envia por e-mail (configure MAIL_*)
otp.provider=${OTP_PROVIDER:log}
otp.remetente=${OTP_REMETENTE:nao-responda@estudaenade.app}
otp.expiration-minutes=10
otp.rate-limit-max-attempts=3
otp.rate-limit-window-minutes=10
otp.max-tentativas-verificacao=5

otp.codigo-fixo=${OTP_CODIGO_FIXO:123456}

# Usado somente quando otp.provider=smtp
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

# ---------- Cadastro ----------
# Professor entra aprovado só com convite de outro professor; sem convite, fica pendente até um
# professor aprovado liberar. O domínio do e-mail não aprova (alunos também têm e-mail institucional).
# Validade do convite de professor (uso único)
cadastro.professor.convite-validade-dias=${CONVITE_PROFESSOR_VALIDADE_DIAS:7}

# ---------- CORS ----------
# Origens da versão web do aluno e do portal do professor, separadas por vírgula.
# Padrão: localhost e rede local em qualquer porta.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*]}

# ---------- Swagger ----------
# Documentação navegável em /swagger-ui.html. Ela mostra o contrato escrito em
# src/main/resources/static/openapi/estuda-enade-api.json, o mesmo arquivo de onde o
# OpenAPI Generator gera as interfaces dos controllers e as classes de requisição.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi/estuda-enade-api.json
# O springdoc também monta um documento a partir do código em /v3/api-docs (não dá para desligar
# sem desligar a tela). Ele não é o contrato e fica fechado: só responde com token.

# ---------- Actuator e logs ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.com.estudaenade=INFO
logging.level.org.springframework.security=WARN
